<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawings | Joshua Cooper</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Space+Mono&display=swap');

        :root {
            --primary-color: #8A2BE2;
            --secondary-color: #4B0082;
            --text-color: #E0E0E0;
            --bg-color: #0A0A0A;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Space Mono', monospace;
            color: var(--text-color);
            background-color: var(--bg-color);
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 50px 20px 20px;
            background: linear-gradient(to bottom, #1A1A1A, #0A0A0A);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 3em;
            margin: 0;
            text-shadow: 0 0 10px var(--primary-color), 0 0 20px var(--primary-color);
        }

        header p {
            margin-top: 15px;
            color: var(--text-color);
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgba(26, 26, 26, 0.8);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.3);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.6);
        }
        .card img {
            display: block;
            width: 100%;
            height: 260px;
            object-fit: cover;
            background: #111;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            margin: 30px 10px;
            color: var(--text-color);
            background-color: var(--secondary-color);
            border: 2px solid var(--primary-color);
            border-radius: 30px;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background-color: var(--primary-color);
            box-shadow: 0 0 20px var(--primary-color);
        }

        /* Lightbox */
        #lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            padding: 20px;
        }
        #lightbox.open { display: flex; }
        #lightbox img {
            max-width: 92vw;
            max-height: 82vh;
            border-radius: 10px;
            box-shadow: 0 0 40px rgba(138, 43, 226, 0.6);
        }
        #lightbox .lb-close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2.5em;
            color: var(--text-color);
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
        }
    </style>
</head>
<body>
    <header>
        <h1>Drawings</h1>
        <p>A gallery of my art</p>
    </header>

    <div class="container">
        <div id="gallery" class="gallery"></div>
        <div style="text-align: center;">
            <a href="index.html" class="btn">Back</a>
        </div>
    </div>

    <div id="lightbox">
        <span class="lb-close" onclick="closeLightbox()">&times;</span>
        <img id="lb-img" src="" alt="">
    </div>

    <script>
        const gallery = document.getElementById('gallery');

        fetch('drawings/manifest.json')
            .then(r => r.ok ? r.json() : [])
            .then(images => {
                if (!images.length) {
                    gallery.innerHTML = '<div class="empty">No drawings yet — drop image files into the <code>drawings/</code> folder.</div>';
                    return;
                }
                for (const img of images) {
                    const src = 'drawings/' + img.file;
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = '<img loading="lazy" src="' + src + '" alt="">';
                    card.addEventListener('click', () => openLightbox(src));
                    gallery.appendChild(card);
                }
            })
            .catch(() => {
                gallery.innerHTML = '<div class="empty">Could not load the gallery.</div>';
            });

        const lightbox = document.getElementById('lightbox');
        const lbImg = document.getElementById('lb-img');

        function openLightbox(src) {
            lbImg.src = src;
            lightbox.classList.add('open');
        }
        function closeLightbox() {
            lightbox.classList.remove('open');
            lbImg.src = '';
        }
        lightbox.addEventListener('click', e => {
            if (e.target === lightbox) closeLightbox();
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeLightbox();
        });
    </script>
</body>
</html>
